name: Deploy ArrowFlow to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/arrow-flow-puzzle/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/arrow-flow-puzzle
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/arrow-flow-puzzle/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/arrow-flow-puzzle/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
